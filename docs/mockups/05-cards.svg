    <g transform="translate(30 44) scale(1)" fill="none" stroke="#1F7F74" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M9.5 4.5v15"/></g><text x="30" y="108" class="ui" font-size="36" font-weight="750" fill="#1C1B19">Inbox</text><path transform="translate(150 82) scale(0.9166666666666666)" d="M12 2.5C12.9 8 16 11.1 21.5 12 16 12.9 12.9 16 12 21.5 11.1 16 8 12.9 2.5 12 8 11.1 11.1 8 12 2.5Z" fill="#1F7F74"/><text x="30" y="138" class="ui" font-size="15" font-weight="400" fill="#6B6862">Linear Algebra · lectures 13–16  ·  18 cards  ·  Claude (VPS)  ·  2 h ago</text><rect x="30" y="154" width="300" height="6" rx="3" fill="#EEEBE5"/><rect x="30" y="154" width="100" height="6" rx="3" fill="#1F7F74"/><text x="340" y="161" class="ui" font-size="12" font-weight="400" fill="#6B6862">6 of 18 triaged</text><rect x="1130" y="86" width="206" height="42" rx="21" fill="#EEEBE5"/><text x="1233" y="112.4" class="ui" font-size="15" font-weight="650" fill="#1F7F74" text-anchor="middle">Accept all remaining</text><rect x="20" y="180" width="410" height="832" rx="20" fill="#fff" filter="url(#sh)"/><text x="46" y="220" class="ui" font-size="15" font-weight="700" fill="#2E9E62" text-anchor="middle">✓</text><text x="66" y="218" class="serif" font-size="15" font-weight="400" fill="#1C1B19">Define an eigenvalue of α ∈ End(V).</text><text x="66" y="238" class="ui" font-size="12" font-weight="400" fill="#9C988F">Definition · L12</text><line x1="66" y1="254" x2="414" y2="254" stroke="#F0EDE7" stroke-width="1" stroke-linecap="round"/><text x="46" y="288" class="ui" font-size="15" font-weight="700" fill="#2E9E62" text-anchor="middle">✓</text><text x="66" y="286" class="serif" font-size="15" font-weight="400" fill="#1C1B19">Show that eigenvectors for distinct eigenva…</text><text x="66" y="306" class="ui" font-size="12" font-weight="400" fill="#9C988F">Theorem · L12</text><line x1="66" y1="322" x2="414" y2="322" stroke="#F0EDE7" stroke-width="1" stroke-linecap="round"/><text x="46" y="356" class="ui" font-size="15" font-weight="700" fill="#E5484D" text-anchor="middle">✕</text><text x="66" y="354" class="serif" font-size="15" font-weight="400" fill="#9C988F">What is a matrix?</text><text x="66" y="374" class="ui" font-size="12" font-weight="400" fill="#9C988F">Definition · L12 · rejected</text><line x1="66" y1="390" x2="414" y2="390" stroke="#F0EDE7" stroke-width="1" stroke-linecap="round"/><text x="46" y="424" class="ui" font-size="15" font-weight="700" fill="#2E9E62" text-anchor="middle">✓</text><text x="66" y="422" class="serif" font-size="15" font-weight="400" fill="#1C1B19">α is diagonalisable iff …</text><text x="66" y="442" class="ui" font-size="12" font-weight="400" fill="#9C988F">Theorem · L13</text><line x1="66" y1="458" x2="414" y2="458" stroke="#F0EDE7" stroke-width="1" stroke-linecap="round"/><text x="46" y="492" class="ui" font-size="15" font-weight="700" fill="#2E9E62" text-anchor="middle">✓</text><text x="66" y="490" class="serif" font-size="15" font-weight="400" fill="#1C1B19">Give a matrix that is not diagonalisable ov…</text><text x="66" y="510" class="ui" font-size="12" font-weight="400" fill="#9C988F">Example · L13</text><line x1="66" y1="526" x2="414" y2="526" stroke="#F0EDE7" stroke-width="1" stroke-linecap="round"/><text x="46" y="560" class="ui" font-size="15" font-weight="700" fill="#2E9E62" text-anchor="middle">✓</text><text x="66" y="558" class="serif" font-size="15" font-weight="400" fill="#1C1B19">State the primary decomposition theorem.</text><text x="66" y="578" class="ui" font-size="12" font-weight="400" fill="#9C988F">Theorem · L14</text><line x1="66" y1="594" x2="414" y2="594" stroke="#F0EDE7" stroke-width="1" stroke-linecap="round"/><rect x="28" y="598" width="394" height="64" rx="12" fill="#DDEFEC"/><text x="46" y="628" class="ui" font-size="15" font-weight="700" fill="#1F7F74" text-anchor="middle">●</text><text x="66" y="626" class="serif" font-size="15" font-weight="400" fill="#1C1B19">Define the minimal polynomial m_α of α…</text><text x="66" y="646" class="ui" font-size="12" font-weight="400" fill="#9C988F">Definition · L14</text><circle cx="46" cy="691" r="5" fill="none" stroke="#9C988F" stroke-width="1.5"/><text x="66" y="694" class="serif" font-size="15" font-weight="400" fill="#1C1B19">m_α divides every p with p(α) = 0. Why?</text><text x="66" y="714" class="ui" font-size="12" font-weight="400" fill="#E8930C">Proof idea · L14  ·  ⚠ similar card exists</text><line x1="66" y1="730" x2="414" y2="730" stroke="#F0EDE7" stroke-width="1" stroke-linecap="round"/><circle cx="46" cy="759" r="5" fill="none" stroke="#9C988F" stroke-width="1.5"/><text x="66" y="762" class="serif" font-size="15" font-weight="400" fill="#1C1B19">State the Cayley–Hamilton theorem.</text><text x="66" y="782" class="ui" font-size="12" font-weight="400" fill="#E8930C">Theorem · L15  ·  ⚠ duplicate?</text><line x1="66" y1="798" x2="414" y2="798" stroke="#F0EDE7" stroke-width="1" stroke-linecap="round"/><circle cx="46" cy="827" r="5" fill="none" stroke="#9C988F" stroke-width="1.5"/><text x="66" y="830" class="serif" font-size="15" font-weight="400" fill="#1C1B19">Compute χ and m for J₃(λ).</text><text x="66" y="850" class="ui" font-size="12" font-weight="400" fill="#9C988F">Example · L16</text><line x1="66" y1="866" x2="414" y2="866" stroke="#F0EDE7" stroke-width="1" stroke-linecap="round"/><circle cx="46" cy="895" r="5" fill="none" stroke="#9C988F" stroke-width="1.5"/><text x="66" y="898" class="serif" font-size="15" font-weight="400" fill="#1C1B19">Define a Jordan block J_k(λ).</text><text x="66" y="918" class="ui" font-size="12" font-weight="400" fill="#9C988F">Definition · L16</text><line x1="66" y1="934" x2="414" y2="934" stroke="#F0EDE7" stroke-width="1" stroke-linecap="round"/><circle cx="46" cy="963" r="5" fill="none" stroke="#9C988F" stroke-width="1.5"/><text x="66" y="966" class="serif" font-size="15" font-weight="400" fill="#1C1B19">Number of Jordan blocks for λ = ?</text><text x="66" y="986" class="ui" font-size="12" font-weight="400" fill="#9C988F">Formula · L16</text><rect x="450" y="180" width="896" height="832" rx="20" fill="#fff" filter="url(#sh)"/><rect x="474" y="200" width="128" height="26" rx="13" fill="#EEF0FE"/><circle cx="486" cy="213" r="3.5" fill="#5B6CF0"/><text x="495" y="217.5" class="ui" font-size="12.5" font-weight="600" fill="#3A47B8">Linear Algebra</text><rect x="610" y="200" width="53" height="26" rx="13" fill="#EEEBE5"/><text x="619" y="217.5" class="ui" font-size="12.5" font-weight="600" fill="#6B6862">Basic</text><rect x="671" y="200" width="88" height="26" rx="13" fill="#E8F5EE"/><text x="680" y="217.5" class="ui" font-size="12.5" font-weight="600" fill="#2E9E62">Definition</text><rect x="767" y="200" width="39" height="26" rx="13" fill="#EEEBE5"/><text x="776" y="217.5" class="ui" font-size="12.5" font-weight="600" fill="#6B6862">L14</text><rect x="814" y="200" width="151" height="26" rx="13" fill="#EEEBE5"/><text x="823" y="217.5" class="ui" font-size="12.5" font-weight="600" fill="#1F7F74">#minimal-polynomial</text><rect x="1132" y="200" width="179" height="26" rx="13" fill="#fff" stroke="#E2DED6" stroke-width="1"/><text x="1141" y="217.32" class="ui" font-size="12" font-weight="600" fill="#1F7F74">↗ Source: LA notes p. 58</text><text x="474" y="258" class="ui" font-size="11" font-weight="700" fill="#9C988F" letter-spacing="1">FRONT</text><rect x="474" y="266" width="404" height="70" rx="12" fill="#FAF9F6" stroke="#E2DED6" stroke-width="1"/><text x="488" y="292" class="mono" font-size="13.5" font-weight="400" fill="#1C1B19">Define the minimal polynomial <tspan fill="#C2410C">$</tspan>m_<tspan fill="#7A3FB8">\alpha</tspan><tspan fill="#C2410C">$</tspan></text><text x="488" y="314" class="mono" font-size="13.5" font-weight="400" fill="#1C1B19">of <tspan fill="#C2410C">$</tspan><tspan fill="#7A3FB8">\alpha</tspan> <tspan fill="#7A3FB8">\in</tspan> <tspan fill="#7A3FB8">\mathrm</tspan>{End}(V)<tspan fill="#C2410C">$</tspan>.</text><text x="474" y="358" class="ui" font-size="11" font-weight="700" fill="#9C988F" letter-spacing="1">BACK</text><rect x="474" y="366" width="404" height="112" rx="12" fill="#FAF9F6" stroke="#E2DED6" stroke-width="1"/><text x="488" y="392" class="mono" font-size="13.5" font-weight="400" fill="#1C1B19">The monic polynomial <tspan fill="#C2410C">$</tspan>m_<tspan fill="#7A3FB8">\alpha</tspan> <tspan fill="#7A3FB8">\in</tspan> F[t]<tspan fill="#C2410C">$</tspan> of</text><text x="488" y="414" class="mono" font-size="13.5" font-weight="400" fill="#1C1B19">least degree with <tspan fill="#C2410C">$</tspan>m_<tspan fill="#7A3FB8">\alpha</tspan>(<tspan fill="#7A3FB8">\alpha</tspan>) = 0<tspan fill="#C2410C">$</tspan>. For</text><text x="488" y="436" class="mono" font-size="13.5" font-weight="400" fill="#1C1B19">every <tspan fill="#C2410C">$</tspan>p <tspan fill="#7A3FB8">\in</tspan> F[t]<tspan fill="#C2410C">$</tspan>:</text><text x="488" y="458" class="mono" font-size="13.5" font-weight="400" fill="#1C1B19"><tspan fill="#C2410C">$</tspan><tspan fill="#C2410C">$</tspan>p(<tspan fill="#7A3FB8">\alpha</tspan>) = 0 <tspan fill="#7A3FB8">\iff</tspan> m_<tspan fill="#7A3FB8">\alpha</tspan> <tspan fill="#7A3FB8">\mid</tspan> p.<tspan fill="#C2410C">$</tspan><tspan fill="#C2410C">$</tspan></text><text x="474" y="500" class="ui" font-size="11" font-weight="700" fill="#9C988F" letter-spacing="1">EXTRA</text><rect x="474" y="508" width="404" height="44" rx="12" fill="#FAF9F6" stroke="#E2DED6" stroke-width="1"/><text x="488" y="534" class="mono" font-size="13.5" font-weight="400" fill="#1C1B19"><tspan fill="#9C988F">Proof idea, notes… (optional)</tspan></text><rect x="466" y="570" width="420" height="46" rx="12" fill="#EEEBE5"/><rect x="474" y="578" width="39" height="30" rx="7" fill="#fff"/><text x="493.5" y="598" class="mono" font-size="12.5" font-weight="400" fill="#1C1B19" text-anchor="middle">$ $</text><rect x="518" y="578" width="55" height="30" rx="7" fill="#fff"/><text x="545.5" y="598" class="mono" font-size="12.5" font-weight="400" fill="#1C1B19" text-anchor="middle">$$ $$</text><rect x="578" y="578" width="86" height="30" rx="7" fill="#fff"/><text x="621" y="598" class="mono" font-size="12.5" font-weight="400" fill="#1C1B19" text-anchor="middle">\mathbb{}</text><rect x="669" y="578" width="70" height="30" rx="7" fill="#fff"/><text x="704" y="598" class="mono" font-size="12.5" font-weight="400" fill="#1C1B19" text-anchor="middle">\forall</text><rect x="744" y="578" width="39" height="30" rx="7" fill="#fff"/><text x="763.5" y="598" class="mono" font-size="12.5" font-weight="400" fill="#1C1B19" text-anchor="middle">\to</text><rect x="788" y="578" width="39" height="30" rx="7" fill="#fff"/><text x="807.5" y="598" class="mono" font-size="12.5" font-weight="400" fill="#1C1B19" text-anchor="middle">^{}</text><rect x="832" y="578" width="24" height="30" rx="7" fill="#fff"/><text x="844" y="598" class="mono" font-size="12.5" font-weight="400" fill="#1C1B19" text-anchor="middle">⋯</text><rect x="474" y="630" width="224" height="40" rx="12" fill="#fff" stroke="#E2DED6" stroke-width="1"/><g transform="translate(488 640) scale(0.8333333333333334)" fill="none" stroke="#1F7F74" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.8L15.5 4.9a2 2 0 0 1 2.8 0l.8.8a2 2 0 0 1 0 2.8L8.8 18.8z"/></g><text x="516" y="656" class="ui" font-size="14" font-weight="600" fill="#1F7F74">Write it  →  LaTeX</text><path transform="translate(670 642) scale(0.5833333333333334)" d="M12 2.5C12.9 8 16 11.1 21.5 12 16 12.9 12.9 16 12 21.5 11.1 16 8 12.9 2.5 12 8 11.1 11.1 8 12 2.5Z" fill="#1F7F74"/><text x="902" y="258" class="ui" font-size="11" font-weight="700" fill="#9C988F" letter-spacing="1">PREVIEW</text><rect x="902" y="266" width="420" height="404" rx="18" fill="#FBFAF7" stroke="#E2DED6" stroke-width="1"/><text x="926" y="310" class="serif" font-size="19" font-weight="400" fill="#1C1B19">Define the minimal polynomial <tspan font-style="italic">m</tspan><tspan font-size="13" dy="5" font-style="italic">α</tspan><tspan dy="-5"></tspan></text><text x="926" y="338" class="serif" font-size="19" font-weight="400" fill="#1C1B19">of <tspan font-style="italic">α</tspan> ∈ End(<tspan font-style="italic">V</tspan>).</text><line x1="926" y1="362" x2="1298" y2="362" stroke="#E2DED6" stroke-width="1" stroke-linecap="round"/><text x="926" y="398" class="serif" font-size="18" font-weight="400" fill="#1C1B19">The monic polynomial <tspan font-style="italic">m</tspan><tspan font-size="13" dy="5" font-style="italic">α</tspan><tspan dy="-5"></tspan> ∈ <tspan font-style="italic">F</tspan>[<tspan font-style="italic">t</tspan>] of least</text><text x="926" y="426" class="serif" font-size="18" font-weight="400" fill="#1C1B19">degree with <tspan font-style="italic">m</tspan><tspan font-size="13" dy="5" font-style="italic">α</tspan><tspan dy="-5"></tspan>(<tspan font-style="italic">α</tspan>) = 0. For every</text><text x="926" y="454" class="serif" font-size="18" font-weight="400" fill="#1C1B19"><tspan font-style="italic">p</tspan> ∈ <tspan font-style="italic">F</tspan>[<tspan font-style="italic">t</tspan>]:</text><text x="1112" y="504" class="serif" font-size="22" font-weight="400" fill="#1C1B19" text-anchor="middle"><tspan font-style="italic">p</tspan>(<tspan font-style="italic">α</tspan>) = 0  ⟺  <tspan font-style="italic">m</tspan><tspan font-size="13" dy="5" font-style="italic">α</tspan><tspan dy="-5"></tspan> | <tspan font-style="italic">p</tspan>.</text><text x="926" y="650" class="ui" font-size="12" font-weight="400" fill="#9C988F">KaTeX · renders as you type · errors shown inline</text><rect x="470" y="692" width="856" height="236" rx="18" fill="#F3FAF8" stroke="#CDE7E2" stroke-width="1"/><path transform="translate(488 710) scale(0.8333333333333334)" d="M12 2.5C12.9 8 16 11.1 21.5 12 16 12.9 12.9 16 12 21.5 11.1 16 8 12.9 2.5 12 8 11.1 11.1 8 12 2.5Z" fill="#1F7F74"/><text x="518" y="726" class="ui" font-size="15" font-weight="400" fill="#0F4D46" font-style="italic">“make the back one line shorter, keep the divisibility property”</text><text x="490" y="762" class="ui" font-size="10.5" font-weight="700" fill="#9C988F" letter-spacing="1">BACK: SUGGESTED CHANGE</text><rect x="490" y="772" width="816" height="34" rx="8" fill="#FDECEC"/><text x="504" y="794" class="mono" font-size="13" font-weight="400" fill="#A12B2F">− The monic polynomial m_α ∈ F[t] of least degree with m_α(α) = 0. For every p ∈ F[t]:</text><rect x="490" y="812" width="816" height="34" rx="8" fill="#E6F6EC"/><text x="504" y="834" class="mono" font-size="13" font-weight="400" fill="#1F6B43">+ The least-degree monic m_α with m_α(α) = 0; then for all p:</text><rect x="490" y="864" width="120" height="40" rx="20" fill="#1F7F74"/><text x="550" y="889.4" class="ui" font-size="15" font-weight="650" fill="#fff" text-anchor="middle">Accept</text><rect x="620" y="864" width="110" height="40" rx="20" fill="#fff" stroke="#E2DED6" stroke-width="1"/><text x="675" y="889.4" class="ui" font-size="15" font-weight="650" fill="#1C1B19" text-anchor="middle">Reject</text><rect x="750" y="864" width="556" height="40" rx="20" fill="#fff" stroke="#CDE7E2" stroke-width="1"/><text x="770" y="889" class="ui" font-size="14" font-weight="400" fill="#9C988F">Ask AI to change this card…</text><rect x="470" y="948" width="200" height="48" rx="24" fill="#fff" stroke="#E2DED6" stroke-width="1"/><text x="570" y="977.76" class="ui" font-size="16" font-weight="650" fill="#E5484D" text-anchor="middle">Reject  (R)</text><rect x="682" y="948" width="160" height="48" rx="24" fill="#fff" stroke="#E2DED6" stroke-width="1"/><text x="762" y="977.76" class="ui" font-size="16" font-weight="650" fill="#1C1B19" text-anchor="middle">Edit  (E)</text><rect x="1106" y="948" width="220" height="48" rx="24" fill="#1F7F74"/><g transform="translate(1122 963) scale(0.75)" fill="none" stroke="#fff" stroke-width="2.6666666666666665" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="1226" y="977.76" class="ui" font-size="16" font-weight="650" fill="#fff" text-anchor="middle">Accept  (A)</text>
