[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathsmaster-server"
version = "0.1.0"
description = "MathsMaster companion service: backup mirror, Anki import and Claude jobs/threads"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "zstandard>=0.22,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mathsmaster-server = "mathsmaster_server.cli:main"

[tool.setuptools.packages.find]
include = ["mathsmaster_server*"]

[tool.setuptools.package-data]
mathsmaster_server = ["claude/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
