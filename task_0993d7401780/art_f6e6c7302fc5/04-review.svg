      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.14"/>
    </filter>
    <pattern id="dots" width="14.2" height="14.2" patternUnits="userSpaceOnUse">
      <circle cx="7.1" cy="7.1" r="0.9" fill="#C9C4BA"/>
    </pattern>
    <pattern id="dotsSmall" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.5" fill="#CFCAC0"/>
    </pattern>
    <pattern id="squares" width="14.2" height="14.2" patternUnits="userSpaceOnUse">
      <path d="M14.2 0 V14.2 H0" fill="none" stroke="#E4E9F0" stroke-width="0.8"/>
    </pattern>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#F6F4F0" stop-opacity="0.86"/>
    </linearGradient>
  </defs>
  <defs><clipPath id="screen"><rect x="0" y="0" width="1366" height="1024" rx="24"/></clipPath></defs>
  <rect x="0" y="0" width="1406" height="1064" rx="44" fill="#1E1E20"/>
  <rect x="2" y="2" width="1402" height="1060" rx="42" fill="none" stroke="#3A3A3E" stroke-width="2"/>
  <g transform="translate(20 20)" clip-path="url(#screen)">
    <rect x="0" y="0" width="1366" height="1024" fill="#F4F2EE"/>
    <rect x="0" y="0" width="1366" height="1024" rx="0" fill="#F1EFEA"/><rect x="12" y="30" width="1342" height="56" rx="28" fill="url(#glass)" stroke="#fff" stroke-width="1" filter="url(#sh)"/><g transform="translate(28 46) scale(1)" fill="none" stroke="#1F7F74" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></g><text x="58" y="64" class="ui" font-size="16" font-weight="400" fill="#1F7F74">End</text><text x="170" y="64" class="ui" font-size="16" font-weight="700" fill="#1C1B19">All courses</text><rect x="290" y="54" width="360" height="8" rx="4" fill="#EEEBE5"/><rect x="290" y="54" width="101.25" height="8" rx="4" fill="#1F7F74"/><text x="664" y="64" class="rnd" font-size="13" font-weight="600" fill="#6B6862">18 / 64</text><text x="740" y="64" class="ui" font-size="13" font-weight="700" fill="#3B7BF5">New 3</text><text x="800" y="64" class="ui" font-size="13" font-weight="700" fill="#E8930C">Learning 5</text><text x="886" y="64" class="ui" font-size="13" font-weight="700" fill="#2E9E62">Review 38</text><g transform="translate(1270 46) scale(1)" fill="none" stroke="#1F7F74" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 6L4 10.5 8.5 15"/><path d="M4 10.5h10a5 5 0 0 1 0 10h-3"/></g><g transform="translate(1316 46) scale(1)" fill="none" stroke="#1F7F74" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></g><rect x="56" y="110" width="720" height="760" rx="26" fill="#fff" filter="url(#sh2)"/><rect x="84" y="136" width="240" height="26" rx="13" fill="#EEF0FE"/><circle cx="96" cy="149" r="3.5" fill="#5B6CF0"/><text x="105" y="153.5" class="ui" font-size="12.5" font-weight="600" fill="#3A47B8">Linear Algebra · Theorem · L15</text><text x="748" y="154" class="ui" font-size="12" font-weight="400" fill="#9C988F" text-anchor="end">due 6 d overdue · reviewed 4×</text><text x="96" y="218" class="serif" font-size="28" font-weight="400" fill="#1C1B19">State the Cayley–Hamilton theorem.</text><line x1="84" y1="250" x2="748" y2="250" stroke="#E2DED6" stroke-width="1" stroke-linecap="round"/><text x="96" y="276" class="ui" font-size="10.5" font-weight="700" fill="#9C988F" letter-spacing="1">YOUR ATTEMPT</text><g transform="translate(724 260) scale(0.75)" fill="none" stroke="#9C988F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.8L15.5 4.9a2 2 0 0 1 2.8 0l.8.8a2 2 0 0 1 0 2.8L8.8 18.8z"/></g><text x="106" y="322" class="hand" font-size="22" font-weight="400" fill="#1E4FD8">A ∈ Mₙ(F),  χ_A(t) = det(tI − A)</text><text x="106" y="364" class="hand" font-size="22" font-weight="400" fill="#1E4FD8">⇒  χ_A(A) = 0     (A satisfies its own</text><text x="346" y="400" class="hand" font-size="22" font-weight="400" fill="#1E4FD8">char. polynomial)</text><path d="M106 376 q 30 6 60 0" fill="none" stroke="#1E4FD8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="76" y="446" width="680" height="300" rx="18" fill="#F7F6F2"/><text x="96" y="476" class="ui" font-size="10.5" font-weight="700" fill="#2E9E62" letter-spacing="1">ANSWER</text><text x="96" y="518" class="serif" font-size="21" font-weight="400" fill="#1C1B19">Let <tspan font-style="italic">V</tspan> be a finite-dimensional vector space over <tspan font-style="italic">F</tspan> and</text><text x="96" y="552" class="serif" font-size="21" font-weight="400" fill="#1C1B19"><tspan font-style="italic">α</tspan> ∈ End(<tspan font-style="italic">V</tspan>) with characteristic polynomial</text><text x="256" y="596" class="serif" font-size="23" font-weight="400" fill="#1C1B19"><tspan font-style="italic">χ</tspan><tspan font-size="14" dy="5" font-style="italic">α</tspan><tspan dy="-5">(</tspan><tspan font-style="italic">t</tspan>) = det(<tspan font-style="italic">t</tspan><tspan font-style="italic">ι</tspan> − <tspan font-style="italic">α</tspan>).</text><text x="96" y="640" class="serif" font-size="21" font-weight="400" fill="#1C1B19">Then <tspan font-style="italic">χ</tspan><tspan font-size="14" dy="5" font-style="italic">α</tspan><tspan dy="-5">(</tspan><tspan font-style="italic">α</tspan>) = 0.</text><line x1="96" y1="668" x2="716" y2="668" stroke="#E2DED6" stroke-width="1" stroke-linecap="round"/><g transform="translate(92 684) scale(0.75)" fill="none" stroke="#6B6862" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 7l5 5-5 5"/></g><text x="114" y="699" class="ui" font-size="14" font-weight="400" fill="#6B6862">Extra: proof idea (triangularise over ℂ, or the adjugate trick)</text><rect x="96" y="714" width="179" height="24" rx="12" fill="#fff" stroke="#E2DED6" stroke-width="1"/><text x="105" y="730.5" class="ui" font-size="12.5" font-weight="600" fill="#1F7F74">↗ LA notes 2026 · p. 61</text><rect x="56" y="900" width="720" height="92" rx="26" fill="url(#glass)" stroke="#fff" stroke-width="1" filter="url(#sh2)"/><rect x="68" y="912" width="188" height="68" rx="18" fill="#E5484D"/><text x="162" y="942" class="ui" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Again</text><text x="162" y="964" class="rnd" font-size="13" font-weight="600" fill="rgba(255,255,255,0.9)" text-anchor="middle">&lt; 10 m</text><text x="244" y="928" class="ui" font-size="10" font-weight="700" fill="rgba(255,255,255,0.7)" text-anchor="end">1</text><rect x="264" y="912" width="132" height="68" rx="18" fill="#fff" stroke="#E2DED6" stroke-width="1"/><text x="330" y="942" class="ui" font-size="18" font-weight="700" fill="#E8930C" text-anchor="middle">Hard</text><text x="330" y="964" class="rnd" font-size="13" font-weight="600" fill="#6B6862" text-anchor="middle">2 d</text><text x="384" y="928" class="ui" font-size="10" font-weight="700" fill="#9C988F" text-anchor="end">2</text><rect x="404" y="912" width="212" height="68" rx="18" fill="#2E9E62"/><text x="510" y="942" class="ui" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Good</text><text x="510" y="964" class="rnd" font-size="13" font-weight="600" fill="rgba(255,255,255,0.9)" text-anchor="middle">6 d</text><text x="604" y="928" class="ui" font-size="10" font-weight="700" fill="rgba(255,255,255,0.7)" text-anchor="end">3</text><rect x="624" y="912" width="116" height="68" rx="18" fill="#fff" stroke="#E2DED6" stroke-width="1"/><text x="682" y="942" class="ui" font-size="18" font-weight="700" fill="#3B7BF5" text-anchor="middle">Easy</text><text x="682" y="964" class="rnd" font-size="13" font-weight="600" fill="#6B6862" text-anchor="middle">14 d</text><text x="728" y="928" class="ui" font-size="10" font-weight="700" fill="#9C988F" text-anchor="end">4</text><circle cx="820" cy="176" r="26" fill="#1F7F74"/><path transform="translate(809 165) scale(0.9166666666666666)" d="M12 2.5C12.9 8 16 11.1 21.5 12 16 12.9 12.9 16 12 21.5 11.1 16 8 12.9 2.5 12 8 11.1 11.1 8 12 2.5Z" fill="#fff"/><text x="820" y="220" class="ui" font-size="11.5" font-weight="650" fill="#1F7F74" text-anchor="middle">Explain</text><circle cx="820" cy="260" r="26" fill="#fff" stroke="#E2DED6" stroke-width="1"/><g transform="translate(808 248) scale(1)" fill="none" stroke="#1F7F74" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></g><text x="820" y="304" class="ui" font-size="11.5" font-weight="450" fill="#6B6862" text-anchor="middle">Source</text><circle cx="820" cy="344" r="26" fill="#fff" stroke="#E2DED6" stroke-width="1"/><g transform="translate(808 332) scale(1)" fill="none" stroke="#1F7F74" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.5L16 4.5l3.5 3.5-11 11z"/><path d="M14 6.5l3.5 3.5"/></g><text x="820" y="388" class="ui" font-size="11.5" font-weight="450" fill="#6B6862" text-anchor="middle">Edit</text><circle cx="820" cy="428" r="26" fill="#fff" stroke="#E2DED6" stroke-width="1"/><g transform="translate(808 416) scale(1)" fill="none" stroke="#1F7F74" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 21V4h12l-2.5 4.5 2.5 4.5h-12"/></g><text x="820" y="472" class="ui" font-size="11.5" font-weight="450" fill="#6B6862" text-anchor="middle">Flag</text><circle cx="820" cy="512" r="26" fill="#fff" stroke="#E2DED6" stroke-width="1"/><g transform="translate(808 500) scale(1)" fill="none" stroke="#1F7F74" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></g><text x="820" y="556" class="ui" font-size="11.5" font-weight="450" fill="#6B6862" text-anchor="middle">More</text><rect x="880" y="110" width="470" height="882" rx="24" fill="#fff" filter="url(#sh2)"/><path transform="translate(902 132) scale(0.9166666666666666)" d="M12 2.5C12.9 8 16 11.1 21.5 12 16 12.9 12.9 16 12 21.5 11.1 16 8 12.9 2.5 12 8 11.1 11.1 8 12 2.5Z" fill="#1F7F74"/><text x="934" y="150" class="ui" font-size="19" font-weight="700" fill="#1C1B19">Explain</text><text x="1328" y="150" class="ui" font-size="12" font-weight="400" fill="#9C988F" text-anchor="end">Gemini</text><text x="902" y="178" class="ui" font-size="14" font-weight="400" fill="#6B6862">Cayley–Hamilton: why is it true?</text><text x="902" y="220" class="serif" font-size="15" font-weight="400" fill="#1C1B19">Over ℂ, pick a basis <tspan font-style="italic">v</tspan><tspan font-size="11" dy="4">1</tspan><tspan dy="-4">, …, </tspan><tspan font-style="italic">v</tspan><tspan font-size="11" dy="4" font-style="italic">n</tspan><tspan dy="-4"> making </tspan><tspan font-style="italic">A</tspan></text><text x="902" y="246" class="serif" font-size="15" font-weight="400" fill="#1C1B19">upper triangular, with diagonal <tspan font-style="italic">λ</tspan><tspan font-size="11" dy="4">1</tspan><tspan dy="-4">, …, </tspan><tspan font-style="italic">λ</tspan><tspan font-size="11" dy="4" font-style="italic">n</tspan><tspan dy="-4">.</tspan></text><text x="902" y="272" class="serif" font-size="15" font-weight="400" fill="#1C1B19">Then (<tspan font-style="italic">A</tspan> − <tspan font-style="italic">λ</tspan><tspan font-size="11" dy="4" font-style="italic">i</tspan><tspan dy="-4"> </tspan><tspan font-style="italic">I</tspan>) maps ⟨<tspan font-style="italic">v</tspan><tspan font-size="11" dy="4">1</tspan><tspan dy="-4">, …, </tspan><tspan font-style="italic">v</tspan><tspan font-size="11" dy="4" font-style="italic">i</tspan><tspan dy="-4">⟩ into</tspan></text><text x="902" y="298" class="serif" font-size="15" font-weight="400" fill="#1C1B19">⟨<tspan font-style="italic">v</tspan><tspan font-size="11" dy="4">1</tspan><tspan dy="-4">, …, </tspan><tspan font-style="italic">v</tspan><tspan font-size="11" dy="4" font-style="italic">i</tspan><tspan font-size="11">−1</tspan><tspan dy="-4">⟩.</tspan> Applying the factors for</text><text x="902" y="324" class="serif" font-size="15" font-weight="400" fill="#1C1B19"><tspan font-style="italic">i</tspan> = <tspan font-style="italic">n</tspan>, <tspan font-style="italic">n</tspan> − 1, …, 1 in turn shrinks <tspan font-style="italic">V</tspan> to 0,</text><text x="902" y="350" class="serif" font-size="15" font-weight="400" fill="#1C1B19">and their product is <tspan font-style="italic">χ</tspan><tspan font-size="11" dy="4" font-style="italic">A</tspan><tspan dy="-4">(</tspan><tspan font-style="italic">A</tspan>).</text><rect x="896" y="386" width="438" height="104" rx="14" fill="#FFF6E5"/><text x="910" y="410" class="ui" font-size="10.5" font-weight="700" fill="#E8930C" letter-spacing="1">COMMON MISTAKE</text><text x="902" y="436" class="serif" font-size="14.5" font-weight="400" fill="#1C1B19">“Substitute <tspan font-style="italic">t</tspan> = <tspan font-style="italic">A</tspan> into det(<tspan font-style="italic">tI</tspan> − <tspan font-style="italic">A</tspan>)” is wrong:</text><text x="902" y="460" class="serif" font-size="14.5" font-weight="400" fill="#1C1B19">det(<tspan font-style="italic">AI</tspan> − <tspan font-style="italic">A</tspan>) is a scalar, not the matrix</text><text x="902" y="482" class="serif" font-size="14.5" font-weight="400" fill="#1C1B19"><tspan font-style="italic">χ</tspan><tspan font-size="10" dy="4" font-style="italic">A</tspan><tspan dy="-4">(</tspan><tspan font-style="italic">A</tspan>).</text><rect x="902" y="520" width="75" height="30" rx="15" fill="#DDEFEC"/><text x="914" y="539.68" class="ui" font-size="13" font-weight="600" fill="#1F7F74">Example</text><rect x="985" y="520" width="126" height="30" rx="15" fill="#DDEFEC"/><text x="997" y="539.68" class="ui" font-size="13" font-weight="600" fill="#1F7F74">Counterexample</text><rect x="1119" y="520" width="75" height="30" rx="15" fill="#DDEFEC"/><text x="1131" y="539.68" class="ui" font-size="13" font-weight="600" fill="#1F7F74">Simpler</text><rect x="902" y="560" width="133" height="30" rx="15" fill="#DDEFEC"/><text x="914" y="579.68" class="ui" font-size="13" font-weight="600" fill="#1F7F74">Over any field?</text><rect x="902" y="612" width="170" height="38" rx="19" fill="#EEEBE5"/><text x="987" y="636.04" class="ui" font-size="14" font-weight="650" fill="#1C1B19" text-anchor="middle">Save to Extra</text><rect x="896" y="900" width="438" height="48" rx="24" fill="#EEEBE5"/><text x="916" y="930" class="ui" font-size="15" font-weight="400" fill="#9C988F">Ask a follow-up…</text><g transform="translate(1268 912) scale(0.9166666666666666)" fill="none" stroke="#6B6862" stroke-width="1.9636363636363638" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.8L15.5 4.9a2 2 0 0 1 2.8 0l.8.8a2 2 0 0 1 0 2.8L8.8 18.8z"/></g><circle cx="1310" cy="924" r="18" fill="#1F7F74"/><g transform="translate(1300 914) scale(0.8333333333333334)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2.5-6.5z"/><path d="M11.5 13.5L20 4"/></g><text x="902" y="974" class="ui" font-size="11.5" font-weight="400" fill="#9C988F">AI budget today: 14 of 20 vision · 380 of 500 text</text>
    <text x="24" y="19" class="ui" font-size="14" font-weight="650" fill="#1C1B19">9:41</text>
    <text x="70" y="19" class="ui" font-size="14" font-weight="500" fill="#1C1B19">Sun 22 Nov</text>
    <rect x="1320" y="8" width="26" height="12" rx="3.5" fill="none" stroke="#1C1B19" stroke-width="1.2"/><rect x="1322" y="10" width="20" height="8" rx="2" fill="#1C1B19"/><rect x="1347" y="12" width="2" height="4" rx="1" fill="#1C1B19"/>
    <text x="1312" y="19" class="ui" font-size="13" font-weight="600" fill="#1C1B19" text-anchor="end">100%</text>
  </g>
</svg>
