# Linux CI for the VPS service in server/. Separate from the app's macOS workflow.
# It only runs the test suite: Claude is replaced by fakes (tests/fake_claude.py and
# FakeRunner). No AI job ever runs on GitHub Actions: the repo is public.
name: Server (Linux)

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: server
    env:
      # Belt and braces: even if something tried the real CLI, there is none to find.
      MM_CLAUDE_BIN: /bin/false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: server/requirements.lock
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[test]"
      - name: Byte-compile
        run: python -m compileall -q mathsmaster_server
      - name: Tests
        run: python -m pytest -q
