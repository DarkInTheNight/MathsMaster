    <g transform="translate(18 64) scale(1)" fill="none" stroke="#1F7F74" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></g><text x="196.5" y="82" class="rnd" font-size="15" font-weight="650" fill="#1C1B19" text-anchor="middle">18 / 64</text><g transform="translate(349 64) scale(1)" fill="none" stroke="#1F7F74" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 6L4 10.5 8.5 15"/><path d="M4 10.5h10a5 5 0 0 1 0 10h-3"/></g><rect x="18" y="100" width="357" height="5" rx="2.5" fill="#EEEBE5"/><rect x="18" y="100" width="100.40625" height="5" rx="2.5" fill="#1F7F74"/><rect x="12" y="118" width="369" height="600" rx="22" fill="#fff" filter="url(#sh)"/><rect x="28" y="134" width="185" height="24" rx="12" fill="#EEF0FE"/><circle cx="40" cy="146" r="3.5" fill="#5B6CF0"/><text x="49" y="150.14" class="ui" font-size="11.5" font-weight="600" fill="#3A47B8">Linear Algebra · Theorem</text><text x="28" y="186" class="serif" font-size="20" font-weight="400" fill="#1C1B19">Statement and Proof of the</text><text x="28" y="212" class="serif" font-size="20" font-weight="400" fill="#1C1B19">Cayley–Hamilton Theorem</text><line x1="24" y1="232" x2="369" y2="232" stroke="#E2DED6" stroke-width="1" stroke-linecap="round"/><rect x="24" y="244" width="78" height="24" rx="12" fill="#EEEBE5"/><text x="32" y="259.96" class="ui" font-size="11" font-weight="600" fill="#6B6862">Motivation</text><rect x="107" y="244" width="71" height="24" rx="12" fill="#1C1B19"/><text x="115" y="259.96" class="ui" font-size="11" font-weight="600" fill="#fff">Statement</text><rect x="183" y="244" width="47" height="24" rx="12" fill="#EEEBE5"/><text x="191" y="259.96" class="ui" font-size="11" font-weight="600" fill="#6B6862">Proof</text><rect x="235" y="244" width="71" height="24" rx="12" fill="#EEEBE5"/><text x="243" y="259.96" class="ui" font-size="11" font-weight="600" fill="#6B6862">Intuition</text><text x="28" y="300" class="serif" font-size="14.5" font-weight="400" fill="#1C1B19"><tspan font-weight="700">2. Statement:</tspan></text><text x="28" y="322" class="serif" font-size="14.5" font-weight="400" fill="#1C1B19">Let <tspan font-style="italic">V</tspan> be an <tspan font-style="italic">n</tspan>-dimensional vector space</text><text x="28" y="343" class="serif" font-size="14.5" font-weight="400" fill="#1C1B19">over <tspan font-style="italic">F</tspan> and <tspan font-style="italic">α</tspan> ∈ End(<tspan font-style="italic">V</tspan>). Then</text><text x="196.5" y="377" class="ui" font-size="15" font-weight="400" fill="#1C1B19"></text><text x="196.5" y="377" class="serif" font-size="18" font-weight="400" fill="#1C1B19" text-anchor="middle"><tspan font-style="italic">χ</tspan><tspan font-size="10" dy="3" font-style="italic">α</tspan><tspan dy="-3">&#8202;</tspan>(<tspan font-style="italic">α</tspan>) = 0.</text><text x="28" y="413" class="serif" font-size="14.5" font-weight="400" fill="#1C1B19"><tspan font-weight="700">3. Proof (F = ℂ):</tspan> choose a basis in</text><text x="28" y="434" class="serif" font-size="14.5" font-weight="400" fill="#1C1B19">which <tspan font-style="italic">α</tspan> is upper triangular, diagonal</text><text x="28" y="455" class="serif" font-size="14.5" font-weight="400" fill="#1C1B19"><tspan font-style="italic">λ</tspan><tspan font-size="10" dy="3" font-style="italic">1</tspan><tspan dy="-3">&#8202;</tspan>, …, <tspan font-style="italic">λ</tspan><tspan font-size="10" dy="3" font-style="italic">n</tspan><tspan dy="-3">&#8202;</tspan>, and put <tspan font-style="italic">U</tspan><tspan font-size="10" dy="3" font-style="italic">i</tspan><tspan dy="-3">&#8202;</tspan> = ⟨<tspan font-style="italic">v</tspan><tspan font-size="10" dy="3" font-style="italic">1</tspan><tspan dy="-3">&#8202;</tspan>, …, <tspan font-style="italic">v</tspan><tspan font-size="10" dy="3" font-style="italic">i</tspan><tspan dy="-3">&#8202;</tspan>⟩.</text><text x="28" y="480" class="serif" font-size="14.5" font-weight="400" fill="#1C1B19">Upper-triangularity says</text><text x="196.5" y="512" class="serif" font-size="16" font-weight="400" fill="#1C1B19" text-anchor="middle">(<tspan font-style="italic">α</tspan> − <tspan font-style="italic">λ</tspan><tspan font-size="10" dy="3" font-style="italic">i</tspan><tspan dy="-3">&#8202;</tspan><tspan font-style="italic">ι</tspan>)<tspan font-style="italic">U</tspan><tspan font-size="10" dy="3" font-style="italic">i</tspan><tspan dy="-3">&#8202;</tspan> ⊆ <tspan font-style="italic">U</tspan><tspan font-size="10" dy="3" font-style="italic">i−1</tspan><tspan dy="-3">&#8202;</tspan>,</text><text x="28" y="544" class="serif" font-size="14.5" font-weight="400" fill="#1C1B19" opacity="0.8">so applying the factors in turn shrinks</text><text x="28" y="565" class="serif" font-size="14.5" font-weight="400" fill="#1C1B19" opacity="0.5"><tspan font-style="italic">V</tspan> to 0 …</text><rect x="371" y="290" width="3" height="120" rx="1.5" fill="#D3CEC5"/><rect x="24" y="648" width="116" height="36" rx="18" fill="#1F7F74"/><path transform="translate(36 657) scale(0.6666666666666666)" d="M12 2.5C12.9 8 16 11.1 21.5 12 16 12.9 12.9 16 12 21.5 11.1 16 8 12.9 2.5 12 8 11.1 11.1 8 12 2.5Z" fill="#fff"/><text x="58" y="671" class="ui" font-size="14" font-weight="650" fill="#fff">Discuss</text><rect x="148" y="648" width="100" height="36" rx="18" fill="#fff" stroke="#E2DED6" stroke-width="1"/><g transform="translate(158 656) scale(0.75)" fill="none" stroke="#1F7F74" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></g><text x="180" y="671" class="ui" font-size="14" font-weight="400" fill="#1F7F74">Source</text><g transform="translate(341 655) scale(0.9166666666666666)" fill="none" stroke="#9C988F" stroke-width="1.9636363636363638" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 21V4h12l-2.5 4.5 2.5 4.5h-12"/></g><rect x="12" y="738" width="87.75" height="64" rx="16" fill="#E5484D"/><text x="55.875" y="766" class="ui" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Again</text><text x="55.875" y="786" class="rnd" font-size="12" font-weight="600" fill="rgba(255,255,255,0.9)" text-anchor="middle">&lt;10m</text><rect x="105.75" y="738" width="87.75" height="64" rx="16" fill="#fff" stroke="#E2DED6" stroke-width="1"/><text x="149.625" y="766" class="ui" font-size="16" font-weight="700" fill="#E8930C" text-anchor="middle">Hard</text><text x="149.625" y="786" class="rnd" font-size="12" font-weight="600" fill="#6B6862" text-anchor="middle">2d</text><rect x="199.5" y="738" width="87.75" height="64" rx="16" fill="#2E9E62"/><text x="243.375" y="766" class="ui" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Good</text><text x="243.375" y="786" class="rnd" font-size="12" font-weight="600" fill="rgba(255,255,255,0.9)" text-anchor="middle">6d</text><rect x="293.25" y="738" width="87.75" height="64" rx="16" fill="#fff" stroke="#E2DED6" stroke-width="1"/><text x="337.125" y="766" class="ui" font-size="16" font-weight="700" fill="#3B7BF5" text-anchor="middle">Easy</text><text x="337.125" y="786" class="rnd" font-size="12" font-weight="600" fill="#6B6862" text-anchor="middle">14d</text>
    <rect x="134.5" y="11" width="124" height="36" rx="18" fill="#000"/>
    <text x="46" y="36" class="ui" font-size="16" font-weight="650" fill="#1C1B19">9:41</text>
    <rect x="331" y="25" width="26" height="12" rx="3.5" fill="none" stroke="#1C1B19" stroke-width="1.2"/><rect x="333" y="27" width="20" height="8" rx="2" fill="#1C1B19"/>
    <rect x="126.5" y="840" width="140" height="5" rx="2.5" fill="#1C1B19"/>
  </g>
