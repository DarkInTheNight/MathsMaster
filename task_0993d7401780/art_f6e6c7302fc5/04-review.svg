<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1406 1064" width="1406" height="1064" role="img" aria-label="MathsMaster: card review with Explain panel">
  <title>MathsMaster: card review with Explain panel</title>
  <style>
    .ui{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI','Ubuntu','Helvetica Neue',Arial,sans-serif}
